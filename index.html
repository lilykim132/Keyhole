<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Keyhole: landlord scores from past student tenants near CMU and Pitt.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Keyhole — Know your landlord before you sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
:root{
  --ink:#1B1916; --muted:#6E675F; --faint:#A39B91; --line:#ECE5DC;
  --bg:#FFFFFF; --cream:#F5F0E9; --cream2:#FAF7F2;
  --terra:#D2492F; --terra-d:#B03A23; --terra-soft:#FBE4DE;
  --accent:#8B3A7E; --accent-d:#722E67; --accent-soft:#F5E6F1;
  --green:#1E5A43; --green-soft:#DFECE5;
  --amber:#E2A048; --amber-soft:#FBEBD2;
  --water:#DCE7EC; --park:#E3EDDF;
  --r:18px; --shadow:0 1px 2px rgba(27,25,22,.04),0 8px 24px rgba(27,25,22,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.tight{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* nav */
.ribbon{background:var(--cream);color:var(--muted);font-size:12.5px;text-align:center;padding:7px 16px}
.ribbon b{color:var(--ink);font-weight:600}
nav.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:600;font-size:20px;color:var(--accent)}
.navlinks{display:flex;gap:4px;flex:1}
.navlinks a{padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14.5px}
.navlinks a:hover{color:var(--ink);background:var(--cream2)}
.navlinks a.on{color:var(--ink);background:var(--cream)}
.campus{display:flex;background:var(--cream);border-radius:999px;padding:3px}
.campus button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.campus button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:var(--cream);color:var(--ink)}
.btn-ghost:hover{background:#EDE6DC}
.btn-line{border:1px solid var(--line);background:#fff}
.btn-line:hover{border-color:#D8CFC4}
.btn-green{background:var(--green);color:#fff}
.menu-btn{display:none}

/* score pill */
.score{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:600;font-size:16px;color:#fff;flex:none}
.score.lg{width:88px;height:88px;font-size:34px}
.score.sm{width:34px;height:34px;font-size:13px}
.great{background:var(--green)} .mixed{background:var(--amber)} .poor{background:var(--terra)} .none{background:#CFC7BC}
.label{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.label.great{background:var(--green-soft);color:var(--green)}
.label.mixed{background:var(--amber-soft);color:#9A6413}
.label.poor{background:var(--terra-soft);color:var(--terra-d)}
.label.none{background:var(--cream);color:var(--muted)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--cream2);border:1px solid var(--line);font-size:12px;color:var(--muted)}

/* home */
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{font-size:64px;line-height:1.02;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:18px;color:var(--muted);margin:20px 0 32px;max-width:520px}
.searchbox{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:8px;max-width:560px}
.stabs{display:flex;gap:4px;padding:4px 4px 8px}
.stabs button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.stabs button.on{background:var(--ink);color:#fff}
.srow{display:flex;gap:8px;align-items:center;background:var(--cream2);border-radius:16px;padding:6px 6px 6px 16px}
.srow input{flex:1;border:0;background:none;outline:none;font-size:16px;padding:10px 0;min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);align-items:center}
.suggest button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink)}
.suggest button:hover{background:var(--cream2)}
.stack{background:var(--cream);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.stack .cap{font-size:13px;color:var(--muted);padding:0 4px 4px}
.mini{background:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.2s}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mini h4{font-size:17px;font-weight:600}
.mini .sub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 0 64px}
.stat{border-top:2px solid var(--ink);padding-top:16px}
.stat b{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:44px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:14.5px}
.src{font-size:12px;color:var(--faint);margin-top:-48px;padding-bottom:64px}
section.block{padding:56px 0;border-top:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px;gap:16px}
.sechead h2{font-size:32px;font-weight:600}
.sechead p{color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lltile{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff;transition:.2s}
.lltile:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.lltile h4{font-size:17px;font-weight:600;line-height:1.25}
.lltile .sub{font-size:13px;color:var(--muted)}
.lltile q{font-size:13.5px;color:var(--ink);quotes:"\201C" "\201D";display:block;padding-top:12px;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:var(--cream2);border-radius:var(--r);padding:28px}
.step .n{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;margin-bottom:28px;border:1px solid var(--line)}
.step h3{font-size:20px;font-weight:600;margin-bottom:6px}
.step p{color:var(--muted);font-size:14.5px}
.cta{background:var(--accent);color:#fff;border-radius:28px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:24px;margin:56px 0}
.cta h2{font-size:34px;font-weight:600;max-width:560px;line-height:1.15}
.cta p{opacity:.8;margin-top:8px}
.cta .btn{background:#fff;color:var(--accent)}
footer{border-top:1px solid var(--line);padding:32px 0 48px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:underline;text-underline-offset:3px}

/* explore */
.filters{position:sticky;top:64px;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;gap:10px;align-items:center;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.fsel{position:relative}
.fsel select{appearance:none;border:1px solid var(--line);border-radius:999px;padding:8px 32px 8px 14px;background:#fff;font-size:13.5px;font-weight:500;cursor:pointer}
.fsel::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fsel select.set{background:var(--ink);color:#fff;border-color:var(--ink)}
.fsel:has(select.set)::after{border-color:#fff}
.sortpill{margin-left:auto}
.explore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding-top:20px;padding-bottom:40px}
.resultsHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.resultsHead h2{font-size:22px;font-weight:600}
.resultsHead span{color:var(--muted);font-size:13.5px}
.list{display:flex;flex-direction:column;gap:12px}
.lcard{display:grid;grid-template-columns:112px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff;cursor:pointer;transition:.15s;text-align:left;width:100%}
.lcard:hover,.lcard.hl{border-color:#D6CCBF;box-shadow:var(--shadow)}
.thumb{width:112px;height:92px;border-radius:12px;overflow:hidden;display:block}
.lcard .price{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:600;font-size:18px}
.lcard .price small{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
.lcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.lcard .ll{font-size:13.5px;font-weight:600;margin-top:10px;display:flex;align-items:center;gap:8px}
.fav{font-size:11.5px;font-weight:600;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:999px}
.lcard .right{display:flex;flex-direction:column;align-items:center;gap:4px;padding-right:6px}
.lcard .right small{font-size:11px;color:var(--muted)}
.mapbox{position:sticky;top:132px;height:calc(100vh - 160px);min-height:420px;border-radius:24px;overflow:hidden;background:var(--cream2);border:1px solid var(--line)}

.maplegend{position:absolute;left:14px;bottom:14px;background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;gap:12px;box-shadow:var(--shadow)}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.pin{cursor:pointer;transition:transform .15s}
.pin.hl circle.dot{stroke:var(--ink);stroke-width:3}
.kmap{width:100%;height:100%}
.leaflet-container{background:#F1ECE4;font-family:Inter,system-ui,sans-serif}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75)!important;color:var(--muted)}
.leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{color:var(--ink)!important;width:34px!important;height:34px!important;line-height:34px!important}
.kpin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 Inter,sans-serif;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}
.kpin.hl{transform:scale(1.25);outline:2px solid var(--ink);outline-offset:1px}
.cpin{padding:5px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--ink);font:700 12px/1 Inter,sans-serif;color:var(--ink);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:translate(-50%,-50%);display:inline-block}
.cpin.on{background:var(--ink);color:#fff}
.hlabel{transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font:600 10px/1.2 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9C9388;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff}
.mlabel{transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font:600 11px/1.15 Inter,sans-serif;pointer-events:none}
.mlabel b{display:block;font-size:15px;font-family:"Inter Tight",Inter,sans-serif}
.mlabel.dark{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)} .mlabel.light{color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff}
.parklabel{transform:translate(-50%,-50%);white-space:nowrap;font:600 9.5px/1 Inter,sans-serif;letter-spacing:.08em;color:#7C9A73;pointer-events:none}
.leaflet-tooltip.htip{background:var(--ink);color:#fff;border:0;border-radius:8px;font:600 12px Inter,sans-serif;padding:5px 9px;box-shadow:none}
.leaflet-tooltip.htip::before{display:none}
.empty{padding:48px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* landlord */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin:28px 0 20px}
.back:hover{color:var(--ink)}
.llhead{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
.llhead h1{font-size:44px;font-weight:700;line-height:1.05}
.llhead .meta{color:var(--muted);margin-top:8px}
.scorecard{background:var(--cream2);border:1px solid var(--line);border-radius:24px;padding:24px}
.scoretop{display:flex;align-items:center;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:18px}
.scoretop .big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:56px;font-weight:600;line-height:1;letter-spacing:-.03em}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:8px;background:#EAE3D9;border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar b{text-align:right;font-weight:600}
.again{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.again b{color:var(--ink)}
.tabsec{margin-top:40px;display:grid;grid-template-columns:1fr 380px;gap:32px}
.reviews{display:flex;flex-direction:column;gap:12px}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:20px}
.rev .rtop{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px;align-items:center}
.rev p{font-size:15.5px}
.rev .rcats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.verified{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--green)}
.pending{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:#9A6413}
.newtag{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-d);padding:2px 8px;border-radius:99px}
.side h3{font-size:18px;font-weight:600;margin-bottom:12px}
.side .lcard{grid-template-columns:72px 1fr;padding:10px}
.side .thumb{width:72px;height:60px}
.side .lcard .right{display:none}

/* directory */
.dirsearch{display:flex;gap:12px;align-items:center;margin:32px 0 20px;flex-wrap:wrap}
.dirsearch h1{font-size:40px;font-weight:700;flex:1}
.inputpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px;min-width:320px;background:#fff}
.inputpill input{border:0;outline:none;flex:1;padding:8px 0;background:none}
.dirlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:56px}
.dirrow{display:grid;grid-template-columns:48px 1.6fr 1fr 1fr 1fr 24px;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:#fff}
.dirrow:last-child{border-bottom:0}
.dirrow:hover{background:var(--cream2)}
.dirrow h4{font-size:16px;font-weight:600}
.dirrow .sub{font-size:13px;color:var(--muted)}
.dirrow .kv{font-size:13px;color:var(--muted)} .dirrow .kv b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.dirhead{display:grid;grid-template-columns:48px 1.6fr 1fr 1fr 1fr 24px;gap:16px;padding:10px 20px;background:var(--cream2);font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}

/* neighborhoods */
.nbgrid{display:grid;grid-template-columns:340px 1fr;gap:28px;padding:32px 0 56px}
.panel{background:var(--cream2);border:1px solid var(--line);border-radius:24px;padding:24px;align-self:start;position:sticky;top:88px}
.panel h1{font-size:30px;font-weight:700;line-height:1.1;margin-bottom:6px}
.panel>p{color:var(--muted);font-size:14px;margin-bottom:24px}
.ctrl{margin-bottom:22px}
.ctrl .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:10px}
.ctrl .lab span{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:16px}
input[type=range]{width:100%;appearance:none;height:6px;border-radius:99px;background:linear-gradient(to right,var(--accent) var(--p,50%),#E7DFD4 var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer}
.prios{display:flex;flex-wrap:wrap;gap:8px}
.prios button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500}
.prios button.on{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:12px;color:var(--faint);margin-top:8px}
.nbmap{border-radius:24px;overflow:hidden;background:var(--cream2);border:1px solid var(--line);height:520px}

.nblist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nbcard{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;background:#fff}
.nbcard .top{display:flex;justify-content:space-between;align-items:center}
.nbcard h4{font-size:17px;font-weight:600}
.match{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:600;color:var(--green)}
.nbcard p{font-size:13.5px;color:var(--muted)}
.nbcard .facts{display:flex;gap:6px;flex-wrap:wrap}
.nbcard .btn{align-self:flex-start;padding:8px 14px;font-size:13px;margin-top:4px}
.nbcard.top1{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

/* review form */
.formwrap{max-width:720px;margin:0 auto;padding:40px 24px 72px}
.formwrap h1{font-size:40px;font-weight:700;line-height:1.08}
.formwrap>p{color:var(--muted);margin:10px 0 28px;font-size:16px}
.fcard{border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:24px}
.field label.t{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:6px}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rate{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.rate .nm{font-size:14.5px;font-weight:500}
.rate .nm small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.dots{display:flex;gap:6px}
.dots button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);background:#fff}
.dots button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button:hover{border-color:var(--accent)}
.yn{display:flex;gap:8px}
.yn button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;font-weight:600;background:#fff}
.yn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.err{color:var(--terra-d);font-size:13px;font-weight:500}
.done{text-align:center;padding:48px 24px}

function thumb(l, w=112, h=92){

  let win=''; for(let f=0;f<floors;f++) for(let c=0;c<cols;c++){ const ww=bw/(cols*1.8); const gap=(bw-cols*ww)/(cols+1); win+=`<rect x="${(bx+gap+c*(ww+gap)).toFixed(1)}" y="${(top+8+f*fh).toFixed(1)}" width="${ww.toFixed(1)}" height="${(fh*.5).toFixed(1)}" rx="1.5" fill="#fff" opacity=".9"/>`; }

/* ---------------- filtering ---------------- */
function filtered(){
  let arr = LISTINGS.filter(l=>{
    const f=S.f;
    if(f.budget!=='any' && l.price>+f.budget) return false;
    if(f.beds!=='any' && (f.beds==='4'? l.beds<4 : l.beds!=+f.beds)) return false;
    if(f.commute!=='any' && commute(l).min>+f.commute) return false;
    if(f.nb!=='any' && l.nb!==f.nb) return false;
    return true;
  });
  const sc = l=> llById(l.ll).overall ?? -1;
  if(S.f.sort==='score') arr.sort((a,b)=>sc(b)-sc(a) || a.price-b.price);
  if(S.f.sort==='price') arr.sort((a,b)=>a.price-b.price);
  if(S.f.sort==='commute') arr.sort((a,b)=>commute(a).min-commute(b).min);
  return arr;
}

function nbMatch(n){
  const P=S.nbPrefs; const [mins]=n[S.campus];
  const budget = n.rent<=P.budget?1: Math.max(0,1-(n.rent-P.budget)/250);
  const com = mins<=P.commute?1: Math.max(0,1-(mins-P.commute)/12);
  const pr = P.prios.length? P.prios.filter(p=>n.tags.includes(p)).length/P.prios.length : 1;
  return Math.round(100*(0.35*budget+0.3*com+0.35*pr));
}

      <div class="field"><label class="t" for="rvLL">Who was your landlord?</label>
        <select id="rvLL"><option value="">Choose a landlord</option>${opts.map(l=>`<option value="${l.id}" ${RV.ll===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}<option value="__new" ${RV.ll==='__new'?'selected':''}>Someone not listed…</option></select>
        ${RV.ll==='__new'?`<input type="text" id="rvNew" style="margin-top:10px" placeholder="Landlord or company name" value="${esc(RV.newName)}">`:''}
      </div>
      <div class="two">
        <div class="field"><label class="t" for="rvNb">Neighborhood</label><select id="rvNb"><option value="">Choose</option>${NB.map(n=>`<option value="${n.id}" ${RV.nb===n.id?'selected':''}>${n.name}</option>`).join('')}</select></div>
        <div class="field"><label class="t" for="rvYears">When did you live there?</label><select id="rvYears">${['2026–27','2025–26','2024–25','2023–24','Earlier'].map(y=>`<option ${RV.years===y?'selected':''}>${y}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label class="t">Your school</label><div class="yn"><button type="button" data-camp="cmu" class="${RV.campus==='cmu'?'on':''}">CMU</button><button type="button" data-camp="pitt" class="${RV.campus==='pitt'?'on':''}">Pitt</button><button type="button" data-camp="other" class="${RV.campus==='other'?'on':''}">Other</button></div></div>
      <div class="field"><label class="t">Rate them, 1 to 5</label>
        <div class="rate"><div class="nm">Overall</div>${dots('overall')}</div>
        ${CATS.map(([k,lab,help])=>`<div class="rate"><div class="nm">${lab}<small>${help}</small></div>${dots(k)}</div>`).join('')}
      </div>
      <div class="field"><label class="t">Would you rent from them again?</label><div class="yn"><button type="button" data-again="1" class="${RV.again===true?'on':''}">Yes</button><button type="button" data-again="0" class="${RV.again===false?'on':''}">No</button></div></div>
      <div class="field"><label class="t" for="rvText">What should the next tenant know?</label><textarea id="rvText" maxlength="600" placeholder="Repairs, the deposit, surprise fees, how they treated you…">${esc(RV.text)}</textarea><div class="help">Stick to your own experience. Please don't include names or contact details.</div></div>
      ${RV.err?`<div class="err">${esc(RV.err)}</div>`:''}
      <button class="btn btn-primary" type="submit" style="align-self:flex-start;padding:13px 24px" ${RV.saving?'disabled':''}>${RV.saving?'Posting…':'Post review'}</button>
    </form>
  </div>`;
}

let INS=null;
function viewInsights(){
  return `<div class="wrap ins"><h1>Team insights</h1><p>Live counts for MVP Test 1 (does the score change the pick?) and Test 2 (do renters review without pay?).</p><div id="insBody"><div class="empty">Loading…</div></div></div>`;
}
async function loadInsights(){
  const box=$('#insBody'); if(!box) return;
  if(!DB){ box.innerHTML=`<div class="empty">Team insights need a shared database, which this version doesn't have yet.</div>`; return; }
  const can = USER && (USER.canEdit?.() || USER.isOwner?.());
  if(!can){ box.innerHTML=`<div class="empty">This page is for the Keyhole team.</div>`; return; }
  try{
    const ps = await DB.collection('picks').get();
    const picks = docsOf(ps).flatMap(d=>(dataOf(d)?.items||[]));
    const testers = docsOf(ps).length;
    const revs = S.community;
    const reviewers = new Set(revs.map(r=>r.uid)).size;
    const top = picks.filter(p=>p.pickedScore!=null && p.pickedScore>=p.topScoreShown-0.001).length;
    const pctTop = picks.length? Math.round(top/picks.length*100):null;
    box.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="k">Test 1 · Picked the highest-rated landlord shown</div><div class="v">${pctTop==null?'–':pctTop+'%'}</div><div class="pass">Pass: 60%+ · ${picks.length} tour pick${picks.length===1?'':'s'} from ${testers} tester${testers===1?'':'s'}</div></div>
      <div class="kpi"><div class="k">Test 2 · Reviews submitted</div><div class="v">${revs.length}</div><div class="pass">From ${reviewers} student${reviewers===1?'':'s'} · Pass: 40%+ of people sent the form submit in 7 days</div></div>
      <div class="kpi"><div class="k">Avg landlord score of tour picks</div><div class="v">${picks.length?f1(picks.reduce((a,p)=>a+(p.pickedScore||0),0)/picks.length):'–'}</div><div class="pass">vs ${f1(lls().filter(l=>l.overall!=null).reduce((a,l)=>a+l.overall,0)/lls().filter(l=>l.overall!=null).length)} average across landlords</div></div>
    </div>
    <h3 class="tight" style="font-size:20px;margin:28px 0 8px">Latest tour picks</h3>
    <table class="tbl"><tr><th>When</th><th>Listing</th><th>Landlord score</th><th>Best score shown</th><th>Sorted by</th></tr>
    ${picks.sort((a,b)=>b.ts-a.ts).slice(0,20).map(p=>{const l=LISTINGS.find(x=>x.id===p.listingId); return `<tr><td>${new Date(p.ts).toLocaleString()}</td><td>${l?`$${l.price} · ${nbById[l.nb].name}`:p.listingId}</td><td>${p.pickedScore==null?'–':f1(p.pickedScore)}</td><td>${f1(p.topScoreShown)}</td><td>${p.sort}</td></tr>`}).join('') || '<tr><td colspan="5" style="color:var(--muted)">No picks yet.</td></tr>'}</table>`;
  }catch(e){ box.innerHTML=`<div class="empty">Couldn't load insights (${esc(e.message||e)}).</div>`; }
}

/* ---------------- modal ---------------- */
function openListing(id){
  const l=LISTINGS.find(x=>x.id===id); if(!l) return;
  const ll=llById(l.ll), c=commute(l), n=nbById[l.nb], other=commute(l, S.campus==='cmu'?'pitt':'cmu');
  const onTour=S.tour.has(id);
  $('#modal').innerHTML = `<div class="hero-img">${thumb(l,560,200)}<button class="x" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="#1B1916" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
  <div class="body">
    <h2>$${l.price}<span style="font-size:16px;color:var(--muted);font-weight:500">/person</span></h2>
    <div class="sub">${l.beds} bed · ${l.baths} bath · ${l.street}, ${n.name} · Available Aug 2027</div>
    <div class="facts3"><div><b>${c.min} min</b>${c.mode} to ${campusName(S.campus)}</div><div><b>${other.min} min</b>${other.mode} to ${S.campus==='cmu'?'Pitt':'CMU'}</div><div><b>$${(l.price*l.beds).toLocaleString()}</b>total / month</div></div>
    <div class="llbox"><span class="score ${tier(ll.overall)}">${ll.overall==null?'–':f1(ll.overall)}</span><div style="flex:1"><h4>${esc(ll.name)}</h4><div class="sub" style="color:var(--muted)">${tierWord(ll.overall)} · ${ll.n} tenant reviews</div>
      <div class="mini-bars">${CATS.map(([k,lab])=>`<span>${lab} <b>${ll[k]==null?'–':f1(ll[k])}</b></span>`).join('')}</div></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">${l.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
    <div class="mactions"><a class="btn btn-ghost" href="#landlord-${ll.id}" data-close>Landlord reviews</a><button class="btn ${onTour?'btn-green':'btn-primary'}" data-tour="${id}">${onTour?'✓ On your tour list':'I\'d tour this first'}</button></div>
  </div>`;
  $('#scrim').classList.add('open');
}
function closeModal(){ $('#scrim').classList.remove('open'); }

/* ---------------- db ---------------- */
const dataOf = s => s==null?null: (typeof s.data==='function'? s.data(): (s.exists===false?null:s));
const docsOf = s => Array.isArray(s)? s : (s&&s.docs? s.docs : []);
function idOf(d){ return d && (d.id || (d.ref&&d.ref.id)); }

async function initDB(){
  if(!(window.claude && typeof claude.use==='function')){ S.dbState='offline'; loadLocal(); render(); return; }
  try{
    [USER, DB] = await Promise.all([claude.use('user'), claude.use('db')]);
    if(USER && USER.id) UID = await USER.id();
  }catch(e){ DB=null; }
  if(!DB || !UID){ S.dbState='offline'; loadLocal(); render(); return; }
  const timer = setTimeout(()=>{ if(S.dbState==='loading'){ S.dbState='offline'; render(); } },10000);
  try{
    DB.collection('reviews').onSnapshot(snap=>{
      clearTimeout(timer); S.dbState='live';
      const all=[]; docsOf(snap).forEach(d=>{ const uid=idOf(d); (dataOf(d)?.items||[]).forEach(it=>all.push({...it,uid})); });
      S.community = all; S.myReviews = all.filter(r=>r.uid===UID).map(({uid,...r})=>r);
      invalidate(); softRender();
    }, err=>{ clearTimeout(timer); S.dbState='offline'; });
    DB.doc('picks/'+UID).get().then(s=>{ const d=dataOf(s); S.myPicks=d?.items||[]; S.myPicks.forEach(p=>S.tour.add(p.listingId)); }).catch(()=>{});
  }catch(e){ clearTimeout(timer); S.dbState='offline'; }
}
function loadLocal(){ try{ const r=JSON.parse(localStorage.getItem('keyhole_reviews')||'[]'); S.community=r.map(x=>({...x,uid:'local'})); UID=UID||'local'; invalidate(); }catch(e){} }

let writing=Promise.resolve();
async function saveReview(item){
  if(DB && UID && S.dbState!=='offline'){
    const items=[...S.myReviews, item];
    await DB.doc('reviews/'+UID).set({items});
    return 'db';
  }
  try{ const r=JSON.parse(localStorage.getItem('keyhole_reviews')||'[]'); r.push(item); localStorage.setItem('keyhole_reviews',JSON.stringify(r)); }catch(e){}
  S.community.push({...item,uid:'local'}); invalidate(); return 'local';
}
function savePick(p){
  S.myPicks.push(p);
  if(!(DB&&UID)) return;
  const items=[...S.myPicks];
  writing = writing.then(()=>DB.doc('picks/'+UID).set({items})).catch(()=>{});
}

/* ---------------- router/render ---------------- */
function route(){ return (location.hash||'#home').slice(1) || 'home'; }
function render(){
  const r=route(); const app=$('#app');
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', r===a.dataset.nav || (a.dataset.nav==='landlords'&&r.startsWith('landlord-'))));
  if(r==='explore') app.innerHTML=viewExplore();
  else if(r==='landlords') app.innerHTML=viewLandlords();
  else if(r.startsWith('landlord-')) app.innerHTML=viewLandlord(r.slice(9));
  else if(r==='neighborhoods') app.innerHTML=viewNeighborhoods();
  else if(r==='review') app.innerHTML=viewReview();
  else if(r==='insights'){ app.innerHTML=viewInsights(); loadInsights(); }
  else app.innerHTML=viewHome();
  mountMaps();
}
function softRender(){ // re-render without losing scroll, skip if typing in review form
  const r=route(); if(r==='review' && !RV?.done) return; const y=scrollY; render(); scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{ $('#navlinks').classList.remove('open'); closeModal(); render(); scrollTo(0,0); });

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  if(e.target.closest('.leaflet-container')&&!e.target.closest('button,a')) return;
  const t=e.target.closest('button,a,[data-id]'); if(!t) return;
  const d=t.dataset;
  if(t.closest('#campusToggle') && d.c){ S.campus=d.c; document.querySelectorAll('#campusToggle button').forEach(b=>b.classList.toggle('on',b.dataset.c===d.c)); softRender(); return; }
  if(t.id==='menuBtn'){ $('#navlinks').classList.toggle('open'); return; }
  if(d.smode){ S.searchMode=d.smode; render(); setTimeout(()=>$('#heroQ')?.focus(),0); return; }
  if(d.tryNb){ S.f.nb=d.tryNb; location.hash='explore'; return; }
  if(d.tryLl){ location.hash='landlord-'+d.tryLl; return; }
  if(d.open){ openListing(d.open); return; }
  if('close' in d){ closeModal(); return; }
  if(d.tour){
    const id=d.tour; if(S.tour.has(id)){ toast('Already on your tour list'); return; }
    S.tour.add(id);
    const shown = route()==='explore'? filtered() : LISTINGS.filter(x=>x.ll===LISTINGS.find(y=>y.id===id).ll);
    const l=LISTINGS.find(x=>x.id===id);
    savePick({listingId:id, landlordId:l.ll, pickedScore:llById(l.ll).overall, topScoreShown:Math.max(...shown.map(x=>llById(x.ll).overall??0)), shownCount:shown.length, sort:S.f.sort, from:route().startsWith('landlord-')?'landlord':route(), campus:S.campus, ts:Date.now()});
    openListing(id); toast('Added to your tour list'); return;
  }
  if('clear' in d){ S.f={budget:'any',beds:'any',commute:'any',sort:S.f.sort,nb:'any'}; render(); return; }
  if(d.seeLl){ S.f={budget:'any',beds:'any',commute:'any',sort:'score',nb:'any'}; location.hash='explore'; return; }
  if(d.seeNb){ S.f={...S.f, budget:'any', commute:'any', nb:d.seeNb}; location.hash='explore'; return; }
  if(d.reviewFor){ RV=newRV(d.reviewFor); return; }
  if('reviewAgain' in d){ RV=newRV(); render(); scrollTo(0,0); return; }
  if(d.prio){ const P=S.nbPrefs.prios; const i=P.indexOf(d.prio); if(i>=0) P.splice(i,1); else { if(P.length>=3) P.shift(); P.push(d.prio);} document.querySelectorAll('[data-prio]').forEach(b=>b.classList.toggle('on',P.includes(b.dataset.prio))); refreshNb(); return; }
  // review form controls
  if(d.rate){ RV[d.rate]=+d.v; t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=+d.v)); return; }
  if(d.camp){ RV.campus=d.camp; t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(d.again){ RV.again=d.again==='1'; t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
});
$('#scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){ S.f[t.dataset.f]=t.value; render(); return; }
  if(t.id==='rvLL'){ RV.ll=t.value; syncRV(); render(); if(RV.ll==='__new') setTimeout(()=>$('#rvNew')?.focus(),0); return; }
  if(t.id==='rvNb') RV.nb=t.value;
  if(t.id==='rvYears') RV.years=t.value;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.nbp){ const k=t.dataset.nbp; S.nbPrefs[k]=+t.value; refreshNb(); const lo=+t.min, hi=+t.max; t.style.setProperty('--p',((+t.value-lo)/(hi-lo)*100)+'%'); $('#bv').textContent='$'+S.nbPrefs.budget; $('#cv').textContent=S.nbPrefs.commute+' min'; return; }
  if(t.id==='rvText') RV.text=t.value;
  if(t.id==='rvNew') RV.newName=t.value;
  if(t.id==='dirQ'){ S.dirQ=t.value; const pos=t.selectionStart; render(); const n=$('#dirQ'); n.focus(); n.setSelectionRange(pos,pos); }
});
function syncRV(){ const g=id=>$(id); if(g('#rvText')) RV.text=g('#rvText').value; if(g('#rvNew')) RV.newName=g('#rvNew').value; if(g('#rvNb')) RV.nb=g('#rvNb').value; if(g('#rvYears')) RV.years=g('#rvYears').value; }

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const t=e.target;
  if(t.id==='heroSearch'){
    const q=$('#heroQ').value.trim().toLowerCase();
    if(S.searchMode==='landlord'){ S.dirQ=q; location.hash='landlords'; return; }
    const nb = NB.find(n=>n.name.toLowerCase().includes(q) || (q&&q.includes(n.name.toLowerCase().split(' ')[0])));
    const st = LISTINGS.find(l=>q && l.street.toLowerCase().includes(q));
    S.f.nb = nb? nb.id : st? st.nb : 'any';
    location.hash='explore'; if(route()==='explore') render(); return;
  }
  if(t.id==='dirForm') return;
  if(t.id==='rvForm'){
    syncRV();
    const miss = !RV.ll ? 'Choose your landlord.' : (RV.ll==='__new' && RV.newName.trim().length<2) ? 'Add the landlord\'s name.' : !RV.nb ? 'Choose the neighborhood.' :
      ['overall',...CATS.map(c=>c[0])].some(k=>!RV[k]) ? 'Rate all five, 1 to 5.' : RV.again==null ? 'Tell us if you\'d rent from them again.' : RV.text.trim().length<20 ? 'Write a sentence or two (20+ characters) for the next tenant.' : '';
    if(miss){ RV.err=miss; render(); $('.err')?.scrollIntoView({block:'center',behavior:'smooth'}); return; }
    const isNew = RV.ll==='__new';
    const name = RV.newName.trim();
    const existing = isNew && lls().find(l=>l.name.toLowerCase()===name.toLowerCase());
    const landlordId = isNew ? (existing? existing.id : 'c-'+slug(name)) : RV.ll;
    const item = {id:'r'+Date.now().toString(36), landlordId, landlordName: isNew&&!existing? name : null, nb:RV.nb, campus:RV.campus, years:RV.years,
      overall:RV.overall, repairs:RV.repairs, deposit:RV.deposit, comm:RV.comm, pricing:RV.pricing, again:RV.again, text:RV.text.trim().slice(0,600), ts:Date.now()};
    RV.saving=true; RV.err=''; render();
    try{
      const where = await saveReview(item);
      RV.saving=false; RV.done=true; RV.savedId=landlordId; RV.savedLocal = where==='local'; render(); scrollTo(0,0);
    }catch(err){ RV.saving=false; RV.err='Couldn\'t post your review ('+(err.message||'try again')+'). Your answers are still here.'; render(); }
  }
});

/* hover sync list <-> map */
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('.lcard[data-open], .kpin'); const id=c? (c.dataset.open||c.dataset.id) : null;
  if(id===S.hover) return; S.hover=id;
  document.querySelectorAll('.kpin').forEach(p=>p.classList.toggle('hl',p.dataset.id===id));
  document.querySelectorAll('.lcard[data-open]').forEach(p=>p.classList.toggle('hl',p.dataset.open===id));
  Object.entries(PINS).forEach(([k,mk])=>mk.setZIndexOffset(k===id?1000:0));
});

render();
initDB();
</script>
